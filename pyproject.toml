[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cassette-scrub"
version = "0.1.0"
description = "Scrub sensitive headers, query parameters, tokens, and PII from VCR.py YAML and JSON cassettes."
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit>=3.0",
]

[project.scripts]
cassette-scrub = "cassette_scrub.cli:main"

[tool.setuptools.packages.find]
include = ["cassette_scrub*"]
